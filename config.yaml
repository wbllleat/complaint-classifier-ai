# ===== LLM 连接配置 =====
llm:
  provider: qwen # openai | azure | ollama | deepseek | qwen
  model: qwen-max
  api_key_env: sk-45c439fda6de43fcb5e8e516c161fe65
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  temperature: 0.0 # 分类任务建议 0
  max_tokens: 300

# ===== 分类体系配置 =====

classify:
  categories:
    流量问题:
      - 流量超套扣费
      - 流量提醒不到位
      - 套内流量扣减争议
      - 流量限速或封顶不认可
      - 定向流量问题
      - 关闭流量仍产生费用
      - 漫游流量费用
      - 流量查询或退费
    套餐变更问题:
      - 降档或变更受阻
      - 合约解约或取消业务
      - 特定套餐无法办理
      - 查询套餐资源
      - 套餐资费或资源争议
    营销宣传问题:
      - 虚假宣传或宣传不符
      - 规则或条款告知不全
      - 未经确认订购或办理
    增值业务问题:
      - 增值业务或权益扣费
      - 订购后未收到告知短信
      - 已退订仍产生扣费
      - 营销礼包或欢乐享等额外业务扣费
    优惠返还问题:
      - 优惠或赠送或返还问题
      - 到期无法延续优惠
      - 返还或赠送不及时或有误
    主副卡或家庭卡问题:
      - 主副卡费用或资源争议
      - 家庭低消或共享或代付问题
    语音或短信问题:
      - 语音或短信资源扣减
      - 通话或短信提醒问题
    网络信号问题:
      - 信号弱或无信号
      - 无法上网或网速慢
      - 漫游或边界网络费用
    宽带或电视问题:
      - 宽带故障或断网
      - 宽带装移机或无法安装
      - 电视或智能家居或光猫设备出现问题
    携号转网相关问题:
      - 携转挽留或误导办理
      - 携出后使用问题
      - 携转合约或解约争议
    退订或取消问题:
      - 退订或取消不成功
    服务或流程问题:
      - 服务态度或推诿不解决
      - 营销电话或短信骚扰
    查询或退费问题:
      - 退费查证争议
      - 费用或账单查询争议
    其他:
      - 其他问题
  prompt_template_path: prompts/default_classify.yaml
  output_schema_version: "1.0"
  few_shot_examples:
    - text: |
        【问题概述】客户反映流量扣费问题
        【查证情况】核实扣费无误，有短信提醒
        【处理方案】直接解释
      primary: 流量问题
      secondary: 流量超套扣费
      reasoning: 客户对流量扣费有疑问，经查扣费无误
    - text: |
        【问题概述】客户反映信号差
        【查证情况】基站覆盖正常
        【处理方案】解释，建议更换位置
      primary: 网络信号问题
      secondary: 信号弱或无信号
      reasoning: 客户投诉信号质量，属于网络信号问题
    - text: |
        【问题概述】客户要求更改套餐
        【查证情况】套餐合约未到期
        【处理方案】解释合约条款
      primary: 套餐变更问题
      secondary: 降档或变更受阻
      reasoning: 客户要求变更套餐受限于合约
    - text: |
        【问题概述】客户反映客服态度差
        【查证情况】已听取录音
        【处理方案】道歉
      primary: 服务或流程问题
      secondary: 服务态度或推诿不解决
      reasoning: 投诉客服态度，属于服务问题

# ===== 运行时配置 =====
runtime:
  concurrency: 6 # 并发 API 调用数 (1-10)
  rate_limit_rpm: 500 # 每分钟最大请求数
  retry_max_attempts: 3 # 最大重试次数
  retry_backoff_base: 1.0 # 退避基数(秒)
  checkpoint_interval: 500 # 每 N 条保存检查点
  archive_column_name: 归档意见
  mask_phone: false # 是否脱敏手机号
